name: Refresh orbits
on:
  schedule: [{ cron: "17 6 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for g in resource weather planet; do
            curl -sf "https://celestrak.org/NORAD/elements/gp.php?GROUP=$g&FORMAT=tle" > data/$g.txt
            grep -q '^1 ' data/$g.txt
          done
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Refresh orbital elements" && git push
